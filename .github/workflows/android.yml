name: Build App1 APK
on:
  push:
    branches: [ "main" ]
    paths:
      - "www/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk app1-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: app1-debug-apk, path: app1-debug.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: App1 APK · build ${{ github.run_number }}
          files: app1-debug.apk
